apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.serviceName }}
  namespace: apps
  labels:
    app: ${{ values.serviceName }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ${{ values.serviceName }}
  template:
    metadata:
      labels:
        app: ${{ values.serviceName }}
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: ${{ values.serviceName }}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: ${{ values.serviceName }}
          image: YOUR_REGISTRY/${{ values.serviceName }}:latest
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ values.serviceName }}
  namespace: apps
spec:
  selector:
    app: ${{ values.serviceName }}
  ports:
    - port: 80
      targetPort: 8080
      name: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ${{ values.serviceName }}
  namespace: apps
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: ${{ values.serviceName }}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
