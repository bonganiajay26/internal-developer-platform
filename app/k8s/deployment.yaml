# Decision: 2 replicas minimum, pod anti-affinity across nodes, and both
# liveness + readiness probes pointing at /health. Anti-affinity means a
# single node drain (patching, spot reclaim) never takes both replicas
# down at once — the cheapest possible HA guarantee for a stateless service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-service
  namespace: apps
  labels:
    app: sample-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-service
  template:
    metadata:
      labels:
        app: sample-service
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: sample-service
                topologyKey: kubernetes.io/hostname
      containers:
        - name: sample-service
          image: YOUR_REGISTRY/sample-service:latest   # CI overwrites this tag on every build
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sample-service
  namespace: apps
  labels:
    app: sample-service
spec:
  selector:
    app: sample-service
  ports:
    - port: 80
      targetPort: 8080
      name: http
---
# Decision: a ServiceMonitor (Prometheus Operator CRD) rather than manual
# scrape_config edits in Prometheus. This is the actual point of running
# the Operator — a team ships this one file alongside their app and their
# metrics just appear in Prometheus/Grafana with zero platform-team involvement.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sample-service
  namespace: apps
  labels:
    release: monitoring   # must match kube-prometheus-stack's serviceMonitorSelector
spec:
  selector:
    matchLabels:
      app: sample-service
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
