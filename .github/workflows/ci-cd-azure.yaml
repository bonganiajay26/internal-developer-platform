# See the note at the top of ci-cd-aws.yaml — enable only one cloud pipeline
# at a time. This one uses Azure AD federated credentials (OIDC) instead of
# AWS IAM — no static ACR password ever stored as a GitHub secret.
name: azure-build-test-scan-deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"

permissions:
  id-token: write
  contents: write

env:
  ACR_NAME: REPLACE_WITH_YOUR_ACR_NAME
  IMAGE_NAME: sample-service

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---- TEST ----
      - name: Install dependencies
        run: pip install -r app/src/requirements.txt
      - name: Run unit tests
        run: pytest app/src/test_main.py -v

      # ---- BUILD ----
      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} app/

      # ---- SCAN ----
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      # ---- AUTH: OIDC -> Azure AD federated credential, no client secret ----
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ---- PUSH to Azure Container Registry ----
      - name: ACR login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Tag and push image
        run: |
          IMAGE_URI=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} $IMAGE_URI
          docker push $IMAGE_URI

      # ---- DEPLOY = Git commit, same GitOps handoff as the AWS pipeline ----
      - name: Update image tag in GitOps manifest
        run: |
          IMAGE_URI=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          sed -i "s|image: .*sample-service.*|image: ${IMAGE_URI}|" app/k8s/deployment.yaml
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add app/k8s/deployment.yaml
          git commit -m "ci(azure): deploy sample-service ${{ github.sha }}"
          git push
