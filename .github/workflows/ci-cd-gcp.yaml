# See the note at the top of ci-cd-aws.yaml — enable only one cloud pipeline
# at a time. This one uses Workload Identity Federation — GCP's OIDC
# equivalent, and generally considered the simplest of the three to set up.
name: gcp-build-test-scan-deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"

permissions:
  id-token: write
  contents: write

env:
  GCP_REGION: asia-south1
  GCP_PROJECT_ID: REPLACE_WITH_YOUR_PROJECT_ID
  AR_REPO: sample-service-repo
  IMAGE_NAME: sample-service

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---- TEST ----
      - name: Install dependencies
        run: pip install -r app/src/requirements.txt
      - name: Run unit tests
        run: pytest app/src/test_main.py -v

      # ---- BUILD ----
      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} app/

      # ---- SCAN ----
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      # ---- AUTH: Workload Identity Federation, no downloaded JSON key file ----
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # ---- PUSH to Artifact Registry ----
      - name: Tag and push image
        run: |
          IMAGE_URI=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} $IMAGE_URI
          docker push $IMAGE_URI

      # ---- DEPLOY = Git commit, same GitOps handoff as the other two pipelines ----
      - name: Update image tag in GitOps manifest
        run: |
          IMAGE_URI=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          sed -i "s|image: .*sample-service.*|image: ${IMAGE_URI}|" app/k8s/deployment.yaml
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add app/k8s/deployment.yaml
          git commit -m "ci(gcp): deploy sample-service ${{ github.sha }}"
          git push
