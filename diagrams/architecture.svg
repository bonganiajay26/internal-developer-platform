<svg width="900" height="820" viewBox="0 0 900 820" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5"/>
    </marker>
  </defs>
  <style>
    .box { fill:#fff; stroke:#555; stroke-width:1; rx:8; }
    .title { font-size:14px; font-weight:bold; fill:#222; }
    .sub { font-size:11px; fill:#555; }
    .group { fill:#f7f7f7; stroke:#999; stroke-dasharray:4,3; rx:16; }
    .arr { stroke:#555; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
    .lbl { font-size:11px; fill:#333; }
  </style>

  <rect x="370" y="10" width="160" height="44" class="box"/>
  <text x="450" y="36" text-anchor="middle" class="title">Developer</text>

  <line x1="450" y1="54" x2="450" y2="84" class="arr"/>
  <text x="460" y="72" class="lbl">git push</text>

  <rect x="280" y="84" width="340" height="56" class="box" fill="#e6f2ff"/>
  <text x="450" y="105" text-anchor="middle" class="title">GitHub Actions CI</text>
  <text x="450" y="123" text-anchor="middle" class="sub">build -&gt; test -&gt; trivy scan -&gt; push image</text>

  <line x1="620" y1="112" x2="700" y2="112" class="arr"/>
  <text x="640" y="105" class="lbl">image</text>
  <rect x="700" y="88" width="110" height="48" class="box" fill="#e6f2ff"/>
  <text x="755" y="116" text-anchor="middle" class="title">ECR</text>

  <line x1="450" y1="140" x2="450" y2="170" class="arr"/>
  <text x="460" y="158" class="lbl">commits new image tag</text>

  <rect x="280" y="170" width="340" height="48" class="box" fill="#ffe9d6"/>
  <text x="450" y="190" text-anchor="middle" class="title">Git repo (source of truth)</text>
  <text x="450" y="206" text-anchor="middle" class="sub">terraform/  argocd/  app/</text>

  <line x1="450" y1="218" x2="450" y2="248" class="arr"/>
  <text x="460" y="236" class="lbl">Argo CD polls + auto-syncs</text>

  <rect x="280" y="248" width="340" height="48" class="box" fill="#efe0ff"/>
  <text x="450" y="268" text-anchor="middle" class="title">Argo CD (GitOps controller)</text>
  <text x="450" y="284" text-anchor="middle" class="sub">runs inside the cluster</text>

  <line x1="450" y1="296" x2="450" y2="326" class="arr"/>

  <rect x="80" y="326" width="740" height="260" class="group"/>
  <text x="450" y="350" text-anchor="middle" class="title">EKS cluster (VPC, 3 Availability Zones, private subnets)</text>

  <rect x="120" y="370" width="300" height="180" class="box" fill="#dff0ff"/>
  <text x="270" y="392" text-anchor="middle" class="title">apps namespace</text>
  <text x="270" y="414" text-anchor="middle" class="sub">sample-service Deployment</text>
  <text x="270" y="432" text-anchor="middle" class="sub">2 replicas, pod anti-affinity</text>
  <text x="270" y="450" text-anchor="middle" class="sub">liveness/readiness on /health</text>
  <text x="270" y="468" text-anchor="middle" class="sub">/metrics scraped via ServiceMonitor</text>

  <rect x="480" y="370" width="300" height="180" class="box" fill="#fff2cc"/>
  <text x="630" y="392" text-anchor="middle" class="title">monitoring namespace</text>
  <text x="630" y="414" text-anchor="middle" class="sub">Prometheus + Alertmanager</text>
  <text x="630" y="432" text-anchor="middle" class="sub">Grafana dashboards</text>
  <text x="630" y="450" text-anchor="middle" class="sub">node-exporter DaemonSet</text>
  <text x="630" y="468" text-anchor="middle" class="sub">kube-state-metrics</text>

  <line x1="420" y1="460" x2="480" y2="460" class="arr"/>
  <text x="450" y="452" text-anchor="middle" class="lbl">scrapes every 15s</text>

  <line x1="450" y1="586" x2="450" y2="616" class="arr"/>
  <text x="460" y="604" class="lbl">provisions the cluster</text>

  <rect x="280" y="616" width="340" height="56" class="box" fill="#ffe0ec"/>
  <text x="450" y="637" text-anchor="middle" class="title">Terraform (VPC + EKS modules)</text>
  <text x="450" y="655" text-anchor="middle" class="sub">remote state in S3 + DynamoDB lock</text>

  <rect x="670" y="700" width="150" height="48" class="box"/>
  <text x="745" y="728" text-anchor="middle" class="title">Engineer</text>
  <line x1="670" y1="712" x2="630" y2="470" class="arr" stroke-dasharray="3,3"/>
  <text x="900" y="0" opacity="0"> </text>
  <text x="745" y="768" text-anchor="middle" class="sub">views Grafana dashboards</text>

  <text x="450" y="800" text-anchor="middle" class="sub" font-style="italic">
    Note: CI never touches the cluster directly. It builds, tests, scans, pushes an image, and commits a Git change.
    Argo CD is the only thing with cluster write access. Manual kubectl changes get auto-reverted (selfHeal).
  </text>
</svg>
